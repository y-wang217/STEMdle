# Goes to .github/dependabot.yml (not workflows/). Weekly dependency PRs;
# `dependabot/` branches are skipped by the Claude reviewer and merged by a human.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "America/Toronto" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "needs-human-merge"]
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "America/Toronto" }
    labels: ["dependencies", "needs-human-merge"]
