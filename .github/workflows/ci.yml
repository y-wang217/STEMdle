name: CI

# Branch protection requires the `gate` and `e2e` jobs by name. `gate` runs
# every command in `.claude/pipeline.json` gate_commands (the same set the Stop
# hook runs in a Claude session) plus the production build; keep the two in step.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mathdle_test
  E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mathdle_e2e

jobs:
  gate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mathdle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validator/requirements.txt
      - run: npm ci
      - run: pip install -r validator/requirements.txt

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Validator (Python + SymPy)
        run: npm run test:py

      # Unit + integration against real Postgres. The Lean suite skips itself
      # when no Lean toolchain is present.
      - name: Vitest
        run: npm test

      - name: Procedural templates through the validator
        run: npm run check:procedural

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mathdle_test
          APP_SECRET: ci-build-secret-ci-build-secret-ci

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mathdle_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validator/requirements.txt
      - run: npm ci
      - run: pip install -r validator/requirements.txt
      - run: npx playwright install --with-deps chromium

      # One automatic rerun; the warning keeps real flakiness visible.
      - name: Playwright (mobile, small phone, desktop admin)
        run: npm run test:e2e || { echo "::warning::e2e failed once, retrying"; npm run test:e2e; }

      - name: Upload screenshots and report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
